<app-page>
  <div class="break-app-container margin-top-15vh">
    <h1 class="mat-font-display-lg align-center header">
      Hey, I'm <a class="primary">Yeison Cardona</a><br />
      Senior Systems & Software Engineer<br />
      Full-Stack & Backend Architecture
    </h1>
  </div>

  <div class="flex-row flex-wrap items-center margin-top-10vh">
    <a matButton="filled" href="/assets/files/Yeison_Cardona_CV.pdf" target="_blank">
      Download CV
      <mat-icon>description</mat-icon>
    </a>

    <button matButton="outlined" (click)="nextPage.emit('go')">
      View my resume
      <mat-icon>keyboard_double_arrow_down</mat-icon>
    </button>
  </div>

  <div
    class="header-links flex-column gap-small"
    [style.--space]="viewportService.isMediumDown() ? '5vh' : '20vh'"
  >
    <a
      class="flex-row align-items-center"
      target="_blank"
      href="https://www.linkedin.com/in/yeisoncardona/"
    >
      <i class="primary devicon devicon-linkedin-plain"></i>
      <span class="normal-text">LinkedIn</span>
    </a>
    <a
      class="flex-row align-items-center"
      target="_blank"
      href="https://www.github.com/yeisoncardona/"
    >
      <i class="primary devicon devicon-github-original"></i>
      <span class="normal-text">Personal repository</span>
    </a>
    <a class="flex-row align-items-center" target="_blank" href="https://www.github.com/dunderlab/">
      <i class="primary devicon devicon-github-original"></i>
      <span class="normal-text">Business repository</span>
    </a>
  </div>
</app-page>
