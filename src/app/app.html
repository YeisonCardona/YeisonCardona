<span class="mat-font-title-lg open-to-work primary">#OpenToWork</span>

<div #container class="page-background"><app-header (nextPage)="nextPage()"></app-header></div>
<div #container class="page-background"><app-about></app-about></div>
<div #container class="page-background"><app-interest></app-interest></div>
<div #container class="page-background"><app-projects></app-projects></div>
<div #container class="page-background"><app-libraries></app-libraries></div>
<div #container class="page-background"><app-contact></app-contact></div>

@if (!viewportService.isMediumDown()) {
  <div class="page-buttons">
    <div (click)="prevPage()">
      <app-icon-button [disabled]="currentIndex === 0" icon="expand_circle_up"></app-icon-button>
    </div>
    <div (click)="nextPage()">
      <app-icon-button
        [disabled]="containerElements && currentIndex === containerElements.length - 1"
        icon="expand_circle_down"
      ></app-icon-button>
    </div>
  </div>
}

<app-theme-switcher></app-theme-switcher>
